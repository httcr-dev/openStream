services:
  postgres:
    image: postgres:16-alpine
    container_name: openstream-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: openstream
      POSTGRES_PASSWORD: openstream
      POSTGRES_DB: openstream
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data:

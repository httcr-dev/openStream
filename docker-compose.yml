services:
  postgres:
    image: postgres:16-alpine
    container_name: openstream-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: openstream
      POSTGRES_PASSWORD: openstream
      POSTGRES_DB: openstream
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: openstream-jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - jellyfin_config_clean:/config
      - jellyfin_cache_clean:/cache
      - ./data/media:/media:ro
      - ./data/shows:/shows:ro

volumes:
  postgres_data:
  jellyfin_config_clean:
  jellyfin_cache_clean:
